<!doctype html>
<html class="home-root" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <base href="../">
    <style>
      .eye-about-concept {
        position: absolute;
        z-index: 4;
        top: 50%;
        left: 50%;
        width: max(44px, calc(var(--home-mark-size) * 0.2));
        aspect-ratio: 1;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        color: #c7d1d4;
        cursor: pointer;
        text-decoration: none;
      }
      .eye-about-concept:focus-visible {
        outline: 1px solid #78ebff;
        outline-offset: 8px;
      }
      .home-meta .home-links { width: max-content; align-items: center; }
      .home-about-concept {
        display: inline-flex;
        min-height: 44px;
        flex: none;
        align-items: center;
        justify-content: center;
        padding: 0 0.6rem;
        margin-right: 0.2rem;
        color: rgb(243 247 255 / 62%);
        font-size: clamp(0.58rem, 1.15vmin, 0.74rem);
        font-weight: 540;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        transition: color 180ms ease;
      }
      .home-about-concept:hover { color: #78ebff; }
      .home-about-concept:focus-visible { outline: 2px solid #78ebff; outline-offset: 3px; }
      .eye-about-label {
        position: absolute;
        top: 50%;
        left: 100%;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem 1rem 1rem 1.25rem;
        transform: translate(-5px, -50%);
        opacity: 0;
        pointer-events: none;
        white-space: nowrap;
        font: 11px ui-monospace, "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-shadow: 0 1px 10px #000, 0 0 5px #000;
        transition: opacity 180ms ease, transform 180ms ease;
      }
      .eye-about-label::before {
        width: 1.4rem;
        height: 1px;
        background: #78898e;
        content: "";
      }
      .eye-about-label span { color: #78ebff; font-size: 15px; }
      .eye-about-concept:hover .eye-about-label,
      .eye-about-concept:focus-visible .eye-about-label,
      .show-eye-label .eye-about-label {
        opacity: 1;
        transform: translate(0, -50%);
        pointer-events: auto;
      }
      .concept-controls {
        position: fixed;
        z-index: 8;
        top: 1.5rem;
        left: 1.5rem;
        display: grid;
        gap: 0.65rem;
        color: #7f8a8f;
        font: 11px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
      }
      .concept-controls p { margin: 0; }
      .concept-controls button {
        width: fit-content;
        padding: 0.35rem 0;
        border: 0;
        border-bottom: 1px solid #38454a;
        background: none;
        color: #c7d1d4;
        font: inherit;
        cursor: pointer;
      }
      .concept-controls button:focus-visible { outline: 1px solid #78ebff; outline-offset: 4px; }
      @media (prefers-reduced-motion: reduce) {
        .eye-about-label { transition: none; }
      }
      @media (max-width: 500px) {
        .eye-about-label { padding-left: 0.6rem; gap: 0.4rem; font-size: 10px; }
        .eye-about-label::before { width: 0.8rem; }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta
      name="description"
      content="Open-source software, made with care."

    <meta property="og:description" content="We write software">

  </head>

    <script src="logo-webgl.js?v=eye-depth"></script>
    <script src="logo-motion.js?v=eye-depth"></script>

    <aside class="concept-controls" aria-label="Mockup controls">
      <p>About navigation / unpublished draft</p>
      <p>About fades in with the bottom-right links</p>
      <p>Hover the eye to reveal the link</p>
      <button type="button" id="label-toggle" aria-pressed="false">Hold label open</button>
    </aside>
    <script>
      (() => {
        const SHOW_LABEL_CLASS = "show-eye-label";
        const query = new URLSearchParams(window.location.search);
        const toggle = document.querySelector("#label-toggle");
        function setLabelVisibility(visible) {
          document.documentElement.classList.toggle(SHOW_LABEL_CLASS, visible);
          toggle.setAttribute("aria-pressed", String(visible));
          toggle.textContent = visible ? "Return to hover behavior" : "Hold label open";
        }
        toggle.addEventListener("click", () => {
          setLabelVisibility(!document.documentElement.classList.contains(SHOW_LABEL_CLASS));
        });
        setLabelVisibility(query.has("show-label"));
      })();
    </script>
  </body>
</html>
