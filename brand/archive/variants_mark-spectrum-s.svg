    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <g fill="none" stroke-linecap="square" stroke-linejoin="round">
    <path d="M400 112H182C138 112 112 132 112 166C112 194 130 210 166 224L346 288C382 302 400 323 400 352C400 384 374 400 330 400H112" stroke="#a8f51d" stroke-width="78" opacity="0.18" filter="url(#glow)"/>
    <path d="M400 112H182C138 112 112 132 112 166C112 194 130 210 166 224L346 288C382 302 400 323 400 352C400 384 374 400 330 400H112" stroke="#0f5138" stroke-width="58" transform="translate(11 12)"/>
    <path d="M400 112H182C138 112 112 132 112 166C112 194 130 210 166 224L346 288C382 302 400 323 400 352C400 384 374 400 330 400H112" stroke="url(#infrared-beam)" stroke-width="48"/>
    <path d="M400 112H182C138 112 112 132 112 166C112 194 130 210 166 224L346 288C382 302 400 323 400 352C400 384 374 400 330 400H112" stroke="#f1ffdf" stroke-width="5" opacity="0.76"/>
  </g>
  <circle cx="400" cy="112" r="11" fill="#f1ffdf"/>
  <rect x="100" y="388" width="24" height="24" fill="#f1ffdf"/>
