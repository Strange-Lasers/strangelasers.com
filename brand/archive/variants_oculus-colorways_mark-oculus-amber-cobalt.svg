<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Strange Lasers Oculus mark, Amber and cobalt</title>
  <desc id="logo-desc">A mysterious laser eye in the Amber and cobalt colorway</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#111a2b"/>
      <stop offset="0.55" stop-color="#0d1320"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="infrared-beam" gradientUnits="userSpaceOnUse" x1="96" y1="120" x2="416" y2="234">
      <stop offset="0" stop-color="#fff1ad"/>
      <stop offset="0.1" stop-color="#ffd56a"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="gold-beam" gradientUnits="userSpaceOnUse" x1="416" y1="392" x2="96" y2="278">
      <stop offset="0" stop-color="#eef3ff"/>
      <stop offset="0.1" stop-color="#8aafff"/>
      <stop offset="1" stop-color="#356dff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 374C110 92 392 76 442 350" stroke="#ff9f1c" stroke-width="74" opacity="0.18" filter="url(#glow)"/>
    <path d="M70 374C110 92 392 76 442 350" stroke="#4a3014" stroke-width="50" transform="translate(8 9)"/>
    <path d="M70 374C110 92 392 76 442 350" stroke="url(#infrared-beam)" stroke-width="40"/>
    <path d="M70 374C110 92 392 76 442 350" stroke="#fff6d6" stroke-width="4" opacity="0.72"/>
    <path d="M66 146C124 422 388 430 448 138" stroke="#356dff" stroke-width="74" opacity="0.18" filter="url(#glow)"/>
    <path d="M66 146C124 422 388 430 448 138" stroke="#152c59" stroke-width="50" transform="translate(8 9)"/>
    <path d="M66 146C124 422 388 430 448 138" stroke="url(#gold-beam)" stroke-width="40"/>
    <path d="M66 146C124 422 388 430 448 138" stroke="#fff6d6" stroke-width="4" opacity="0.72"/>
    <circle cx="70" cy="374" r="9" fill="#fff6d6"/>
    <rect x="439" y="129" width="18" height="18" fill="#fff6d6"/>
    <circle cx="256" cy="256" r="61" fill="#0a0d14" opacity="0.75" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="47" fill="#0a0d14" stroke="#fff6d6" stroke-width="7"/>
    <circle cx="256" cy="256" r="12" fill="#fff6d6"/>
  </g>
</svg>
