    <path d="M70 326C116 126 370 92 444 250C488 346 302 420 138 370" stroke="url(#infrared-beam)" stroke-width="37"/>
    <path d="M70 326C116 126 370 92 444 250C488 346 302 420 138 370" stroke="#fff8ec" stroke-width="4" opacity="0.72"/>
    <path d="M78 386L434 126" stroke="#8457ff" stroke-width="63" opacity="0.18" filter="url(#glow)"/>
    <path d="M78 386L434 126" stroke="#30205e" stroke-width="39" transform="translate(8 9)"/>
    <path d="M78 386L434 126" stroke="url(#gold-beam)" stroke-width="29"/>
    <path d="M78 386L434 126" stroke="#fff8ec" stroke-width="4" opacity="0.72"/>
    <circle cx="70" cy="326" r="9" fill="#fff8ec"/>
    <rect x="425" y="117" width="18" height="18" fill="#fff8ec"/>
    <circle cx="256" cy="256" r="68" fill="#0d0712" opacity="0.75" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="54" fill="#0d0712" stroke="#fff8ec" stroke-width="7"/>
