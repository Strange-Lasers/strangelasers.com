<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Strange Lasers Accretion mark</title>
  <desc id="logo-desc">A tilted laser ring and opposing jet wrap around a black-hole core</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#251329"/>
      <stop offset="0.55" stop-color="#160b1c"/>
      <stop offset="1" stop-color="#0d0712"/>
    </radialGradient>
    <linearGradient id="infrared-beam" gradientUnits="userSpaceOnUse" x1="96" y1="120" x2="416" y2="234">
      <stop offset="0" stop-color="#fff0d5"/>
      <stop offset="0.1" stop-color="#ffad61"/>
      <stop offset="1" stop-color="#ff5a24"/>
    </linearGradient>
    <linearGradient id="gold-beam" gradientUnits="userSpaceOnUse" x1="416" y1="392" x2="96" y2="278">
      <stop offset="0" stop-color="#f6edff"/>
      <stop offset="0.1" stop-color="#c59aff"/>
      <stop offset="1" stop-color="#8457ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 326C116 126 370 92 444 250C488 346 302 420 138 370" stroke="#ff5a24" stroke-width="71" opacity="0.18" filter="url(#glow)"/>
