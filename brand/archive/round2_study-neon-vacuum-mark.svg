    <path d="M70 362C110 84 402 84 442 362" stroke="#f7fdff" stroke-width="3" opacity="0.9"/>
    <path d="M64 142C124 426 388 426 448 142" stroke="#4b67e8" stroke-width="76" opacity="0.12" filter="url(#glow)"/>
