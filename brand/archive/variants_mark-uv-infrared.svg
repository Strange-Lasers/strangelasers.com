<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Strange Lasers mark, UV and infrared colorway</title>
  <desc id="logo-desc">Two bright laser beams make impossible turns to form an S from a pair of L shapes</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#1b1024"/>
      <stop offset="0.55" stop-color="#120b19"/>
      <stop offset="1" stop-color="#0c0a12"/>
    </radialGradient>
    <linearGradient id="infrared-beam" gradientUnits="userSpaceOnUse" x1="96" y1="120" x2="416" y2="234">
      <stop offset="0" stop-color="#f4edff"/>
      <stop offset="0.1" stop-color="#b99cff"/>
      <stop offset="1" stop-color="#7957ff"/>
    </linearGradient>
    <linearGradient id="gold-beam" gradientUnits="userSpaceOnUse" x1="416" y1="392" x2="96" y2="278">
      <stop offset="0" stop-color="#fff0c9"/>
      <stop offset="0.1" stop-color="#ffad58"/>
      <stop offset="1" stop-color="#ff641f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M96 120H302L416 234" stroke="#7957ff" stroke-width="82" opacity="0.18" filter="url(#glow)"/>
    <path d="M416 392H210L96 278" stroke="#ff641f" stroke-width="82" opacity="0.18" filter="url(#glow)"/>
    <path d="M96 120H302L416 234" stroke="#2c2158" stroke-width="58" transform="translate(10 11)"/>
    <path d="M416 392H210L96 278" stroke="#562211" stroke-width="58" transform="translate(10 11)"/>
    <path d="M96 120H302L416 234" stroke="url(#infrared-beam)" stroke-width="50"/>
    <path d="M416 392H210L96 278" stroke="url(#gold-beam)" stroke-width="50"/>
    <path d="M96 120H302L416 234" stroke="#fff5dd" stroke-width="5" opacity="0.72"/>
    <path d="M416 392H210L96 278" stroke="#fff5dd" stroke-width="5" opacity="0.72"/>
  </g>
  <circle cx="96" cy="120" r="11" fill="#fff5dd"/>
  <circle cx="416" cy="392" r="11" fill="#fff5dd"/>
</svg>
