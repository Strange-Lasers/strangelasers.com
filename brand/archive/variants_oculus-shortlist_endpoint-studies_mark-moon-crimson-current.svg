<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Strange Lasers Moon Crimson Current diagonal mark</title>
  <desc id="logo-desc">A mysterious laser eye with a circle and square split diagonally across separate arcs</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#251112"/>
      <stop offset="0.55" stop-color="#14090a"/>
      <stop offset="1" stop-color="#0b0506"/>
    </radialGradient>
    <linearGradient id="infrared-beam" gradientUnits="userSpaceOnUse" x1="96" y1="120" x2="416" y2="234">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.1" stop-color="#ded7c6"/>
      <stop offset="1" stop-color="#aaa698"/>
    </linearGradient>
    <linearGradient id="gold-beam" gradientUnits="userSpaceOnUse" x1="416" y1="392" x2="96" y2="278">
      <stop offset="0" stop-color="#ffe9e5"/>
      <stop offset="0.1" stop-color="#ff7967"/>
      <stop offset="1" stop-color="#db302b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 374C110 92 392 76 442 350" stroke="#aaa698" stroke-width="74" opacity="0.18" filter="url(#glow)"/>
    <path d="M70 374C110 92 392 76 442 350" stroke="#39362f" stroke-width="50" transform="translate(8 9)"/>
    <path d="M70 374C110 92 392 76 442 350" stroke="url(#infrared-beam)" stroke-width="40"/>
    <path d="M70 374C110 92 392 76 442 350" stroke="#fffcef" stroke-width="4" opacity="0.72"/>
    <path d="M66 146C124 422 388 430 448 138" stroke="#db302b" stroke-width="74" opacity="0.18" filter="url(#glow)"/>
    <path d="M66 146C124 422 388 430 448 138" stroke="#561512" stroke-width="50" transform="translate(8 9)"/>
    <path d="M66 146C124 422 388 430 448 138" stroke="url(#gold-beam)" stroke-width="40"/>
    <path d="M66 146C124 422 388 430 448 138" stroke="#fffcef" stroke-width="4" opacity="0.72"/>
    <circle cx="70" cy="374" r="9" fill="#fffcef"/>
    <rect x="439" y="129" width="18" height="18" fill="#fffcef"/>
    <circle cx="256" cy="256" r="61" fill="#0b0506" opacity="0.75" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="47" fill="#0b0506" stroke="#fffcef" stroke-width="7"/>
    <circle cx="256" cy="256" r="12" fill="#fffcef"/>
  </g>
</svg>
