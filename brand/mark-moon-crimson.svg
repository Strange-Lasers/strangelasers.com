    <path d="M70 362C110 84 402 84 442 362" stroke="url(#corona-rear)" stroke-width="30"/>
    <path d="M70 362C110 84 402 84 442 362" stroke="#fffcef" stroke-width="5" opacity="0.88"/>
    <path d="M70 362C110 84 402 84 442 362" stroke="#fffcef" stroke-width="2"/>
    <path d="M64 142C124 426 388 426 448 142" stroke="#db302b" stroke-width="90" opacity="0.14" filter="url(#corona-wide-glow)"/>
