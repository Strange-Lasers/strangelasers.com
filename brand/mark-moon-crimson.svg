    <path d="M64 142C124 426 388 426 448 142" stroke="url(#corona-front)" stroke-width="30"/>
    <path d="M64 142C124 426 388 426 448 142" stroke="#fffcef" stroke-width="5" opacity="0.88"/>
    <path d="M64 142C124 426 388 426 448 142" stroke="#fffcef" stroke-width="2"/>
