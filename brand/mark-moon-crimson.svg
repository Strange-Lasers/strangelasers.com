    <rect x="50" y="342" width="40" height="40" rx="8" fill="#aaa698" opacity="0.2" filter="url(#corona-tight-glow)"/>
    <circle cx="442" cy="362" r="20" fill="#aaa698" opacity="0.2" filter="url(#corona-tight-glow)"/>
    <circle cx="64" cy="142" r="9" fill="#fffcef"/>
