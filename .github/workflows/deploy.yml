name: Deploy Cloudflare environment

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'preview'
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ github.ref_name == 'main' && 'https://strangelasers.com/' || 'https://preview.strangelasers.com/' }}
    env:
      WRANGLER_CONFIG: ${{ github.ref_name == 'main' && 'wrangler.production.jsonc' || 'wrangler.preview.jsonc' }}
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Install cover capture browser
        run: npm run screenshots:install -- --with-deps

      - name: Validate deployment
        run: npm run check

      - name: Retain generated project cover
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-cover
          path: docs/screenshots/cover.png
          if-no-files-found: error
          retention-days: 7

      - name: Validate static asset bundle
        run: npx --yes wrangler@4.129.1 deploy --dry-run --config "$WRANGLER_CONFIG"

      - name: Deploy static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.129.1 deploy --config "$WRANGLER_CONFIG"

  publish-cover:
    name: Publish project cover
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: project-cover
          path: ${{ runner.temp }}/project-cover
      - name: Commit changed cover from this build
        env:
          COVER_ARTIFACT: ${{ runner.temp }}/project-cover/cover.png
        run: |
          set -eu
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer source commit superseded this cover; its build owns publication."
            exit 0
          fi
          cp "$COVER_ARTIFACT" docs/screenshots/cover.png
          if git diff --quiet -- docs/screenshots/cover.png; then
            echo "Project cover is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/screenshots/cover.png
          git commit -m 'docs: refresh generated project cover' -- docs/screenshots/cover.png
          git push origin HEAD:main
