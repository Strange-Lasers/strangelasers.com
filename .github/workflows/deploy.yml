name: Deploy Cloudflare environment

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'preview'
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ github.ref_name == 'main' && 'https://strangelasers.com/' || 'https://preview.strangelasers.com/' }}
    env:
      WRANGLER_CONFIG: ${{ github.ref_name == 'main' && 'wrangler.production.jsonc' || 'wrangler.preview.jsonc' }}
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Install reproducible cover runtime
        run: npm run cover:install

      - name: Validate deployment
        run: npm run check

      - name: Retain generated project cover
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-cover
          path: docs/screenshots/cover.png
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed project cover
        run: |
          if ! git diff --exit-code -- docs/screenshots/cover.png; then
            echo "::error::Project cover is stale. Run npm run check and commit the generated PNG with its source changes."
            exit 1
          fi

      - name: Validate static asset bundle
        run: npx --yes wrangler@4.129.1 deploy --dry-run --config "$WRANGLER_CONFIG"

      - name: Deploy static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.129.1 deploy --config "$WRANGLER_CONFIG"
