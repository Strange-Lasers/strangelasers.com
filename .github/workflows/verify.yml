name: Verify

on:
  pull_request:
    branches:
      - main
      - preview

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Install reproducible cover runtime
        run: npm run cover:install

      - name: Validate site and cover
        run: npm run check

      - name: Verify committed project cover
        run: git diff --exit-code -- docs/screenshots/cover.png

      - name: Validate static asset bundle
        run: npx --yes wrangler@4.151.3 deploy --dry-run --config wrangler.production.jsonc

      - name: Check patch formatting
        run: git diff --check
